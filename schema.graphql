# Generated from Memgraph Lab exports.
#
# Mapping choices:
# - Memgraph labels and property names are preserved through directives and snake_case fields.
# - All observed node properties are nullable because Memgraph reported mandatory=false.
# - Memgraph Int maps to BigInt to avoid GraphQL Int's signed 32-bit limit.
# - List[Any] maps to [JSON]. Mixed Int/Float maps to Float.
# - Relationship cardinality was not present in the exports, so every relationship is a list.
# - Relationship property types are inferred by matching property names across node properties;
#   an unmatched relationship property maps to JSON.
# - 28 node properties were present in graph metadata but absent from the
#   typed-property export. They use a same-name type inference when available, otherwise JSON.
# - Query fields are a proposed API contract and require application resolvers that execute Cypher.

schema {
  query: Query
}

scalar JSON

enum MemgraphDirection {
  OUT
  IN
}

directive @memgraphNode(label: String!) on OBJECT
directive @memgraphEdge(type: String!, startLabel: String!, endLabel: String!) on OBJECT
directive @memgraphRelationship(type: String!, direction: MemgraphDirection!) on FIELD_DEFINITION

interface MemgraphNode {
  guid: String
}

